name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    # A manual run from another branch must not release that branch. The Go
    # proxy can only read a public repository, and nothing stands between the
    # tag and the release here, so a private repository stops at this job.
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - id: gate
        run: bash .github/scripts/release-version.sh check >> "$GITHUB_OUTPUT"

  # The tag is the release, so ci.yml's whole matrix has to pass before it is
  # cut. These are the same commands as ci.yml.
  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.24", "1.25"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -cover ./...
      - name: no third-party dependencies
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is not empty; a dependency was added"; cat go.sum; exit 1
          fi

  publish:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash .github/scripts/release-version.sh consistency
      - name: tag and release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash .github/scripts/release-version.sh index
