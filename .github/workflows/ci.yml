name: Go SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.22 is the supported floor; the newest release guards against drift.
        go: ["1.22", "1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -cover ./...
      # The module must stay dependency-free outside the standard library.
      - name: no third-party dependencies
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is not empty; a dependency was added"; cat go.sum; exit 1
          fi
